name: oidc-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: token endpoint present
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then echo "URL: present"; else echo "URL: ABSENT"; fi
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then echo "TOKEN: present"; else echo "TOKEN: ABSENT"; fi
      - name: npm identity
        run: |
          npm --version
          echo "--- npmrc files ---"
          ls -la ~/.npmrc /home/runner/work/_temp/.npmrc 2>&1 || true
          echo "--- whoami via OIDC ---"
          npm whoami 2>&1 | head -3
      - name: stage with verbose logging
        run: npm stage publish --loglevel verbose 2>&1 | tail -30
