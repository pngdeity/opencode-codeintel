name: oidc-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: stage, silly log
        run: |
          set +e
          npm stage publish --registry=https://registry.npmjs.org --loglevel silly > /tmp/out.txt 2>&1
          echo "npm exit: $?"
          tail -60 /tmp/out.txt
